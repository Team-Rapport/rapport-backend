<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Spring WebSocket 채팅 테스트</title>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    max-width: 800px;
    margin: 24px auto;
    padding: 0 16px;
    background: #f7f7f9;
    color: #222;
  }
  h1 { font-size: 20px; margin-bottom: 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }

  .card {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  h3 { margin: 0 0 12px; font-size: 15px; }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  label { font-size: 13px; color: #555; white-space: nowrap; }
  input[type=text], input[type=number], textarea {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 60px; }

  button {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: #4a6cf7;
    color: #fff;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover { background: #3b58d6; }
  button:disabled { background: #bbb; cursor: not-allowed; }
  button.secondary { background: #6c757d; }
  button.danger { background: #dc3545; }
  button.success { background: #28a745; }

  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
  }
  .status.connected { background: #d4edda; color: #155724; }
  .status.disconnected { background: #f8d7da; color: #721c24; }

  #chat-log {
    height: 320px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 12px;
    background: #fafafa;
    margin-bottom: 12px;
  }
  .msg { margin-bottom: 10px; max-width: 80%; }
  .msg.me { margin-left: auto; text-align: right; }
  .msg .bubble {
    display: inline-block;
    padding: 8px 12px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.4;
    text-align: left;
    word-break: break-all;
  }
  .msg.me .bubble { background: #4a6cf7; color: #fff; }
  .msg.other .bubble { background: #fff; border: 1px solid #e5e5e5; }
  .msg.system .bubble { background: #fff3cd; border: 1px solid #ffc107; font-size: 12px; color: #856404; }
  .msg .meta { font-size: 11px; color: #999; margin-bottom: 2px; }

  pre {
    background: #1e1e2e;
    color: #d4d4d4;
    padding: 12px;
    border-radius: 8px;
    font-size: 12px;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 200px;
    overflow-y: auto;
    margin: 0;
  }

  .log-line { font-size: 12px; padding: 3px 0; border-bottom: 1px solid #f0f0f0; }
  .log-line.error { color: #dc3545; }
  .log-line.success { color: #28a745; }
  .log-line.info { color: #0d6efd; }

  #event-log {
    max-height: 150px;
    overflow-y: auto;
    border: 1px solid #eee;
    border-radius: 8px;
    padding: 8px;
    background: #fafafa;
  }

  .room-item {
    padding: 8px 12px;
    border: 1px solid #eee;
    border-radius: 8px;
    margin-bottom: 6px;
    font-size: 13px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .room-item:hover { background: #f0f3ff; }
</style>
</head>
<body>

<h1>💬 Spring WebSocket 채팅 테스트</h1>
<p class="sub">Spring Boot (localhost:8080) STOMP 채팅 테스트용</p>

<!-- ===== 인증 / 연결 ===== -->
<div class="card">
  <h3>1. 인증 &amp; WebSocket 연결</h3>
  <div class="row">
    <label>서버 URL:</label>
    <input type="text" id="server-url" value="http://localhost:8080">
  </div>
  <div class="row">
    <label>JWT Token:</label>
    <input type="text" id="jwt-token" placeholder="Bearer 없이 토큰만 입력">
  </div>
  <div class="row">
    <label>내 User ID:</label>
    <input type="number" id="my-user-id" value="1" style="max-width:100px">
    <button onclick="connect()" id="btn-connect">연결</button>
    <button class="danger" onclick="disconnect()" id="btn-disconnect" disabled>연결 해제</button>
    <span id="conn-status" class="status disconnected">disconnected</span>
  </div>
</div>

<!-- ===== 채팅방 ===== -->
<div class="card">
  <h3>2. 채팅방</h3>
  <div class="row">
    <label>Room ID:</label>
    <input type="number" id="room-id" placeholder="채팅방 ID 입력">
    <button onclick="subscribeRoom()" id="btn-subscribe" disabled>구독</button>
    <button class="secondary" onclick="unsubscribeRoom()" id="btn-unsubscribe" disabled>구독 해제</button>
  </div>
  <div class="row">
    <button class="secondary" onclick="getMyRooms()">내 채팅방 목록 조회</button>
    <button class="secondary" onclick="getHistory()">메시지 히스토리 조회</button>
  </div>
  <div id="rooms-list"></div>
</div>

<!-- ===== 채팅 ===== -->
<div class="card">
  <h3>3. 메시지 전송</h3>
  <div id="chat-log"></div>
  <div class="row">
    <input type="text" id="msg-input" placeholder="메시지 입력 후 Enter" disabled>
    <select id="msg-type" style="padding:8px; border:1px solid #ddd; border-radius:8px; font-size:13px;">
      <option value="TEXT">TEXT</option>
      <option value="IMAGE">IMAGE</option>
      <option value="SYSTEM">SYSTEM</option>
    </select>
    <button onclick="sendMessage()" id="btn-send" disabled>전송</button>
  </div>
</div>

<!-- ===== 이벤트 로그 ===== -->
<div class="card">
  <h3>이벤트 로그</h3>
  <div id="event-log"></div>
</div>

<script>
let stompClient = null;
let currentSubscription = null;
let myUserId = 1;

// ──────────────────────────────────────────────
// STOMP 연결
// ──────────────────────────────────────────────

function connect() {
  const serverUrl = document.getElementById('server-url').value.replace(/\/$/, '');
  const token = document.getElementById('jwt-token').value.trim();
  myUserId = parseInt(document.getElementById('my-user-id').value) || 1;

  if (!token) { log('JWT 토큰을 입력하세요.', 'error'); return; }

  stompClient = new StompJs.Client({
    webSocketFactory: () => new SockJS(serverUrl + '/ws'),
    connectHeaders: { 'Authorization': 'Bearer ' + token },
    reconnectDelay: 0,
    onConnect: () => {
      log('WebSocket 연결 성공', 'success');
      setConnected(true);
    },
    onStompError: (frame) => {
      log('STOMP 에러: ' + frame.headers['message'], 'error');
    },
    onDisconnect: () => {
      log('연결 해제됨', 'info');
      setConnected(false);
    },
    onWebSocketError: (e) => {
      log('WebSocket 에러: ' + e, 'error');
    },
  });

  log('연결 시도 중...');
  stompClient.activate();
}

function disconnect() {
  if (stompClient) {
    stompClient.deactivate();
    stompClient = null;
  }
  currentSubscription = null;
  setConnected(false);
}

function setConnected(connected) {
  const statusEl = document.getElementById('conn-status');
  statusEl.textContent = connected ? 'connected' : 'disconnected';
  statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
  document.getElementById('btn-connect').disabled = connected;
  document.getElementById('btn-disconnect').disabled = !connected;
  document.getElementById('btn-subscribe').disabled = !connected;
  document.getElementById('btn-send').disabled = !connected;
  document.getElementById('msg-input').disabled = !connected;
}

// ──────────────────────────────────────────────
// 채팅방 구독 / 해제
// ──────────────────────────────────────────────

function subscribeRoom() {
  const roomId = document.getElementById('room-id').value;
  if (!roomId) { log('Room ID를 입력하세요.', 'error'); return; }
  if (!stompClient?.connected) { log('먼저 WebSocket에 연결하세요.', 'error'); return; }

  if (currentSubscription) {
    currentSubscription.unsubscribe();
    log('기존 구독 해제됨');
  }

  currentSubscription = stompClient.subscribe('/topic/chat.' + roomId, (message) => {
    const data = JSON.parse(message.body);
    appendMessage(data);
    log(`메시지 수신 - senderId: ${data.senderId}, content: "${data.content}"`, 'success');
  });

  document.getElementById('btn-unsubscribe').disabled = false;
  document.getElementById('chat-log').innerHTML = '';
  log(`Room ${roomId} 구독 시작`, 'success');
}

function unsubscribeRoom() {
  if (currentSubscription) {
    currentSubscription.unsubscribe();
    currentSubscription = null;
    document.getElementById('btn-unsubscribe').disabled = true;
    log('구독 해제됨');
  }
}

// ──────────────────────────────────────────────
// 메시지 전송
// ──────────────────────────────────────────────

function sendMessage(forcedText) {
  const roomId = document.getElementById('room-id').value;
  const input = document.getElementById('msg-input');
  const text = forcedText || input.value.trim();
  const messageType = document.getElementById('msg-type').value;

  if (!text) return;
  if (!roomId) { log('Room ID를 입력하세요.', 'error'); return; }
  if (!stompClient?.connected) { log('연결 상태를 확인하세요.', 'error'); return; }

  stompClient.publish({
    destination: '/app/chat.' + roomId,
    body: JSON.stringify({ content: text, messageType }),
  });

  input.value = '';
  log(`메시지 전송: "${text}" (${messageType})`);
}

// ──────────────────────────────────────────────
// REST API
// ──────────────────────────────────────────────

async function getMyRooms() {
  const serverUrl = document.getElementById('server-url').value.replace(/\/$/, '');
  const token = document.getElementById('jwt-token').value.trim();

  try {
    const res = await fetch(serverUrl + '/api/v1/chat/rooms', {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data = await res.json();
    log('채팅방 목록 조회 성공', 'success');

    const list = document.getElementById('rooms-list');
    const rooms = data.data ?? data;
    if (!rooms.length) {
      list.innerHTML = '<div style="font-size:13px;color:#999;margin-top:8px;">채팅방 없음</div>';
      return;
    }
    list.innerHTML = rooms.map(r => `
      <div class="room-item">
        <span>Room <strong>#${r.roomId}</strong> — ${r.clientName} ↔ ${r.counselorName} [${r.status}]</span>
        <button onclick="selectRoom(${r.roomId})" style="padding:4px 10px;font-size:12px;">선택</button>
      </div>
    `).join('');
  } catch (e) {
    log('채팅방 목록 조회 실패: ' + e.message, 'error');
  }
}

async function getHistory() {
  const serverUrl = document.getElementById('server-url').value.replace(/\/$/, '');
  const token = document.getElementById('jwt-token').value.trim();
  const roomId = document.getElementById('room-id').value;

  if (!roomId) { log('Room ID를 입력하세요.', 'error'); return; }

  try {
    const res = await fetch(serverUrl + `/api/v1/chat/rooms/${roomId}/messages`, {
      headers: { 'Authorization': 'Bearer ' + token },
    });
    const data = await res.json();
    const messages = data.data?.messages ?? data.messages ?? [];
    log(`히스토리 조회 성공 - ${messages.length}건`, 'success');

    const chatLog = document.getElementById('chat-log');
    chatLog.innerHTML = '';
    messages.forEach(m => appendMessage(m));
  } catch (e) {
    log('히스토리 조회 실패: ' + e.message, 'error');
  }
}

function selectRoom(roomId) {
  document.getElementById('room-id').value = roomId;
  log(`Room ${roomId} 선택됨`);
}

// ──────────────────────────────────────────────
// UI 헬퍼
// ──────────────────────────────────────────────

function appendMessage(data) {
  const log = document.getElementById('chat-log');
  const isMe = data.senderId === myUserId;
  const isSystem = data.messageType === 'SYSTEM';

  const div = document.createElement('div');
  div.className = 'msg ' + (isSystem ? 'system' : isMe ? 'me' : 'other');
  div.innerHTML = `
    <div class="meta">${isSystem ? 'SYSTEM' : data.senderName ?? 'user ' + data.senderId}</div>
    <div class="bubble"></div>
  `;
  div.querySelector('.bubble').textContent = data.content;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function log(message, type = 'normal') {
  const el = document.getElementById('event-log');
  const line = document.createElement('div');
  line.className = 'log-line ' + (type || '');
  line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
  el.appendChild(line);
  el.scrollTop = el.scrollHeight;
}

// Enter 키 전송
document.getElementById('msg-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});
</script>
</body>
</html>
